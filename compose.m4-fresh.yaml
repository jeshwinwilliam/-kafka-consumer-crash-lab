services:
  kafka:
    image: apache/kafka:4.1.2
    ports:
      - "127.0.0.1:${M4_KAFKA_PORT}:9094"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:${M4_KAFKA_PORT}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --list"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s
  postgres:
    image: postgres:17.11-bookworm
    environment:
      POSTGRES_DB: crashlab
      POSTGRES_USER: crashlab
      POSTGRES_PASSWORD: local-lab-only
    ports:
      - "127.0.0.1:${M4_POSTGRES_PORT}:5432"
    volumes:
      - m4-postgres-data:/var/lib/postgresql/data
      - ./sql/000_base_schema.sql:/docker-entrypoint-initdb.d/000_base_schema.sql:ro
      - ./sql/001_processed_events_identity.sql:/docker-entrypoint-initdb.d/001_processed_events_identity.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crashlab -d crashlab"]
      interval: 5s
      timeout: 5s
      retries: 12
volumes:
  m4-postgres-data:
